<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151515">
  <title>Painel administrativo — SOLO</title>
  <link rel="icon" href="../icofont.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/admin.css?v=20261124-kits">
  <script src="../assets/config.js"></script>
  <script src="../assets/loading.js" defer></script>
  <script src="../assets/order-view.js?v=20261119-order-delete" defer></script>
  <script src="../assets/kit-tools.js?v=20261124-kits" defer></script>
  <script src="../assets/kits.js?v=20261124-kits" defer></script>
  <script src="../assets/panel.js?v=20261124-kits" defer></script>
</head>
<body class="panel-body">
  <aside class="sidebar" id="sidebar" aria-hidden="true">
    <button type="button" class="sidebar-close" id="sidebar-close" aria-label="Fechar menu">×</button>
    <a class="sidebar-brand" href="../index.html"><img src="../1.png" alt="SOLO Ateliê Artesanal"></a>
    <p class="side-label">Espaço de trabalho</p>
    <nav>
      <button class="active" hidden data-page="dashboard">◈ <span>Visão geral</span></button>
      <div id="registrations-menu" hidden>
        <button id="registrations-toggle" type="button" aria-expanded="false" aria-controls="registrations-items">▦ <span>Cadastros</span><span class="nav-chevron" aria-hidden="true">⌄</span></button>
        <div id="registrations-items" class="nav-submenu" hidden>
          <button hidden data-page="users">♙ <span>Usuários</span></button>
          <button hidden data-page="clients">♧ <span>Clientes</span></button>
          <button hidden data-page="suppliers">⛟ <span>Fornecedores</span></button>
          <button hidden data-page="products">🏷 <span>Produtos</span></button>
          <button hidden data-page="kits">▣ <span>Kits</span></button>
          <button hidden data-page="coupons">🎟 <span>Cupons</span></button>
          <button hidden data-page="site_menu">🌐 <span>Menu Site</span></button>
        </div>
      </div>
      <button hidden data-page="orders">▤ <span>Pedidos</span></button>
      <button hidden data-page="finance">◉ <span>Financeiro</span></button>
      <button hidden data-page="settings">⚙ <span>Configurações</span></button>
    </nav>
    <div class="side-bottom">
      <button type="button" data-logout>↪ <span>Sair do sistema</span></button>
      <small>Dados sincronizados com o Google Drive</small>
    </div>
  </aside>
  <button type="button" class="sidebar-backdrop" id="sidebar-backdrop" aria-label="Fechar menu" hidden></button>
  <main class="panel-main">
    <header class="topbar">
      <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div><p class="eyebrow">SOLO / Administração</p><h1 id="page-title">Visão geral</h1></div>
      <div class="user-menu">
        <button class="account-trigger" id="open-profile" type="button">
          <span class="avatar" id="user-avatar">S</span>
          <span class="account-label"><b id="user-name">Carregando…</b><small>Alterar perfil</small></span>
        </button>
        <button class="logout" type="button" data-logout>Sair</button>
      </div>
    </header>
    <section id="workspace" aria-live="polite"><div class="workspace-state">Validando sessão segura…</div></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
